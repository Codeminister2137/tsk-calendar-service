[project]
name = "tsk-calendar-service"
version = "0.1.0"
description = "Calendar service for the Task Scheduler project"
authors = [
    {name = "Codeminister2137",email = "kubajaworski99@wp.pl"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django (>=5.1.7,<6.0.0)",
    "django-admin (>=2.0.2,<3.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "ruff (>=0.11.2,<0.12.0)",
    "pydantic (>=2.11.4,<3.0.0)",
    "djangorestframework (>=3.16.0,<4.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocstrings[python] (>=0.29.1,<0.30.0)",
    "mkdocs-material (>=9.6.14,<10.0.0)"
]

[tool.ruff]
line-length=88
indent-width=4

[tool.ruff.lint]
select=["I"]
ignore=["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
